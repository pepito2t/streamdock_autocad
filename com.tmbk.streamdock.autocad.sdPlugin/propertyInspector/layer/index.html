<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>AutoCAD - Calque</title>
  <link rel="stylesheet" href="../../static/css/sdpi.css" />
  <link rel="stylesheet" href="../../static/css/autocad.css" />
</head>
<body>
  <div class="sdpi-wrapper" style="display: none">
    <div class="sdpi-item">
      <div class="sdpi-item-label">Calque</div>
      <input id="layer" class="sdpi-item-value" placeholder="Nom du calque" />
    </div>
    <div type="checkbox" class="sdpi-item">
      <div class="sdpi-item-label">Création</div>
      <div class="sdpi-item-value">
        <span class="sdpi-item-child">
          <input id="create" type="checkbox" checked />
          <label for="create"><span></span>Créer le calque s'il n'existe pas</label>
        </span>
      </div>
    </div>
  </div>
  <script src="../../static/utils/common.js"></script>
  <script src="../../static/action.js"></script>
  <script src="index.js"></script>
</body>
</html>
